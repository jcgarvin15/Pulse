<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PF Timer">
  <meta name="theme-color" content="#09090b">
  <title>Planet Fitness Interval Timer</title>
  <style>
    :root {
      --bg-primary: #09090b;
      --bg-card: #18181b;
      --bg-card-hover: #27272a;
      --accent-work: #10b981;
      --accent-trans: #f59e0b;
      --accent-rest: #3b82f6;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      overflow-x: hidden;
    }

    header {
      padding: 16px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 20px;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
    }

    /* Day Selector Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: var(--bg-card);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--text-main);
      color: var(--bg-primary);
    }

    /* Main Display Card */
    .timer-card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 24px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      transition: border-color 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .timer-card.state-work { border-color: var(--accent-work); }
    .timer-card.state-trans { border-color: var(--accent-trans); }
    .timer-card.state-rest { border-color: var(--accent-rest); }

    .state-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .state-work .state-badge { background: rgba(16, 185, 129, 0.2); color: var(--accent-work); }
    .state-trans .state-badge { background: rgba(245, 158, 11, 0.2); color: var(--accent-trans); }
    .state-rest .state-badge { background: rgba(59, 130, 246, 0.2); color: var(--accent-rest); }

    .countdown {
      font-size: 5rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin: 10px 0;
      letter-spacing: -0.03em;
    }

    .current-exercise {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 8px;
      min-height: 2rem;
      line-height: 1.3;
    }

    .next-preview {
      font-size: 0.9rem;
      color: var(--text-muted);
      min-height: 1.2rem;
    }

    .meta-info {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Controls */
    .controls {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn {
      padding: 16px;
      border-radius: 16px;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s active;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-primary {
      background: var(--accent-work);
      color: #000;
      font-size: 1.1rem;
    }

    .btn-primary.paused {
      background: var(--accent-trans);
    }

    /* Routine List */
    .routine-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .superset-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      transition: all 0.2s ease;
    }

    .superset-card.active-superset {
      border-color: var(--text-main);
      background: var(--bg-card-hover);
    }

    .superset-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .exercise-pair {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .exercise-pair span {
      flex: 1;
    }

    .exercise-pair .divider {
      flex: 0;
      margin: 0 8px;
      color: var(--text-muted);
      font-weight: 400;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="workout-title">Day 1: Lower Body & Push Engine</h1>
  </header>

  <div class="container">
    <!-- Day Selection -->
    <div class="tabs">
      <button class="tab-btn active" onclick="selectDay(1)">Day 1</button>
      <button class="tab-btn" onclick="selectDay(2)">Day 2</button>
      <button class="tab-btn" onclick="selectDay(3)">Day 3</button>
    </div>

    <!-- Timer Card -->
    <div class="timer-card state-work" id="timer-card">
      <div class="state-badge" id="state-badge">READY</div>
      <div class="countdown" id="countdown">45</div>
      <div class="current-exercise" id="current-ex">Press Start to Begin</div>
      <div class="next-preview" id="next-ex">Up Next: DB Goblet Squats</div>

      <div class="meta-info">
        <span id="superset-progress">Superset 1 of 6</span>
        <span id="round-progress">Round 1 of 3</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn-secondary" onclick="resetTimer()">Reset</button>
      <button class="btn btn-primary" id="start-btn" onclick="toggleTimer()">START</button>
      <button class="btn btn-secondary" onclick="skipInterval()">Skip</button>
    </div>

    <!-- Routine Breakdown -->
    <div class="routine-list" id="routine-list">
      <!-- Generated via JS -->
    </div>
  </div>

  <script>
    const workouts = {
      1: {
        title: "Day 1: Lower Body & Push Engine",
        supersets: [
          { name: "Superset 1", exA: "DB Goblet Squats", exB: "Push-Ups" },
          { name: "Superset 2", exA: "DB Walking Lunges", exB: "DB Push Press (Thrusters)" },
          { name: "Superset 3", exA: "Cable Straight-Arm Pulldowns", exB: "Cable Pull-Throughs" },
          { name: "Superset 4", exA: "Heavy DB Farmer's Carry", exB: "Mountain Climbers" },
          { name: "Superset 5", exA: "Smith Machine Reverse Lunges", exB: "Forearm Plank" },
          { name: "Superset 6", exA: "Rower (High Intensity)", exB: "Bodyweight Squat Jumps" }
        ]
      },
      2: {
        title: "Day 2: Upper Body & Heavy Conditioning",
        supersets: [
          { name: "Superset 1", exA: "DB Romanian Deadlifts", exB: "DB Bent-Over Rows" },
          { name: "Superset 2", exA: "DB Alternating Snatches", exB: "Burpees" },
          { name: "Superset 3", exA: "Lat Pulldown", exB: "DB Seated Shoulder Press" },
          { name: "Superset 4", exA: "Cable Seated Row", exB: "Core V-Ups" },
          { name: "Superset 5", exA: "DB Step-Ups", exB: "Bench Dips" },
          { name: "Superset 6", exA: "Treadmill Max Incline Walk", exB: "Air Squats" }
        ]
      },
      3: {
        title: "Day 3: Full Body Capacity",
        supersets: [
          { name: "Superset 1", exA: "DB Suitcase Deadlifts", exB: "DB Front Squats" },
          { name: "Superset 2", exA: "DB Renegade Rows", exB: "DB Floor Press" },
          { name: "Superset 3", exA: "Cable Rope Face Pulls", exB: "Cable Woodchoppers" },
          { name: "Superset 4", exA: "DB Bulgarian Split Squats", exB: "Hollow Body Hold" },
          { name: "Superset 5", exA: "DB Overhead Hold", exB: "High Knees" },
          { name: "Superset 6", exA: "Rower (Steady Pace)", exB: "Sit-Ups" }
        ]
      }
    };

    let currentDay = 1;
    let queue = [];
    let queueIndex = 0;
    let timeRemaining = 45;
    let timerId = null;
    let isRunning = false;
    let audioCtx = null;
    let wakeLock = null;
    let expectedEndTime = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep(freq = 880, duration = 0.15) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release();
        wakeLock = null;
      }
    }

    function buildWorkoutQueue(dayNum) {
      const dayData = workouts[dayNum];
      const newQueue = [];

      dayData.supersets.forEach((ss, ssIdx) => {
        for (let round = 1; round <= 3; round++) {
          newQueue.push({
            type: 'WORK',
            duration: 45,
            exercise: ss.exA,
            next: `Transition (15s) → ${ss.exB}`,
            supersetIdx: ssIdx + 1,
            round: round
          });

          newQueue.push({
            type: 'TRANSITION',
            duration: 15,
            exercise: `Rest / Switch to ${ss.exB}`,
            next: `Work (45s) → ${ss.exB}`,
            supersetIdx: ssIdx + 1,
            round: round
          });

          newQueue.push({
            type: 'WORK',
            duration: 45,
            exercise: ss.exB,
            next: round < 3 
              ? `Transition (15s) → ${ss.exA}` 
              : (ssIdx < 5 ? `Superset Rest (60s) → Superset ${ssIdx + 2}` : 'Workout Complete!'),
            supersetIdx: ssIdx + 1,
            round: round
          });

          if (round < 3) {
            newQueue.push({
              type: 'TRANSITION',
              duration: 15,
              exercise: `Rest / Switch to ${ss.exA}`,
              next: `Work (45s) → ${ss.exA}`,
              supersetIdx: ssIdx + 1,
              round: round + 1
            });
          }
        }

        if (ssIdx < dayData.supersets.length - 1) {
          const nextSS = dayData.supersets[ssIdx + 1];
          newQueue.push({
            type: 'REST',
            duration: 60,
            exercise: 'SUPERSET REST',
            next: `Up Next: ${nextSS.name} (${nextSS.exA})`,
            supersetIdx: ssIdx + 1,
            round: 3
          });
        }
      });

      return newQueue;
    }

    function selectDay(dayNum) {
      if (isRunning) toggleTimer();
      currentDay = dayNum;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === dayNum);
      });
      document.getElementById('workout-title').innerText = workouts[dayNum].title;
      renderRoutineList();
      resetTimer();
    }

    function renderRoutineList() {
      const container = document.getElementById('routine-list');
      container.innerHTML = '';
      const dayData = workouts[currentDay];

      dayData.supersets.forEach((ss, idx) => {
        const card = document.createElement('div');
        card.className = 'superset-card';
        card.id = `superset-card-${idx + 1}`;
        card.innerHTML = `
          <div class="superset-title">${ss.name}</div>
          <div class="exercise-pair">
            <span>${ss.exA}</span>
            <span class="divider">/</span>
            <span>${ss.exB}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateDisplay() {
      if (queueIndex >= queue.length) {
        document.getElementById('state-badge').innerText = 'FINISHED';
        document.getElementById('countdown').innerText = '00';
        document.getElementById('current-ex').innerText = 'Workout Complete!';
        document.getElementById('next-ex').innerText = 'Great effort!';
        return;
      }

      const item = queue[queueIndex];
      const card = document.getElementById('timer-card');
      
      card.className = 'timer-card';
      if (item.type === 'WORK') card.classList.add('state-work');
      else if (item.type === 'TRANSITION') card.classList.add('state-trans');
      else card.classList.add('state-rest');

      document.getElementById('state-badge').innerText = item.type === 'REST' ? 'SUPERSET REST' : item.type;
      document.getElementById('countdown').innerText = Math.max(0, timeRemaining).toString().padStart(2, '0');
      document.getElementById('current-ex').innerText = item.exercise;
      document.getElementById('next-ex').innerText = item.next;
      document.getElementById('superset-progress').innerText = `Superset ${item.supersetIdx} of 6`;
      document.getElementById('round-progress').innerText = `Round ${item.round} of 3`;

      document.querySelectorAll('.superset-card').forEach((sc, idx) => {
        sc.classList.toggle('active-superset', idx + 1 === item.supersetIdx);
      });
    }

    function tick() {
      const now = Date.now();
      timeRemaining = Math.round((expectedEndTime - now) / 1000);

      if (timeRemaining <= 3 && timeRemaining > 0) {
        playBeep(440, 0.12);
      }

      if (timeRemaining <= 0) {
        playBeep(880, 0.4);
        queueIndex++;
        if (queueIndex < queue.length) {
          timeRemaining = queue[queueIndex].duration;
          expectedEndTime = Date.now() + (timeRemaining * 1000);
        } else {
          clearInterval(timerId);
          isRunning = false;
          releaseWakeLock();
          document.getElementById('start-btn').innerText = 'START';
          document.getElementById('start-btn').classList.remove('paused');
        }
      }
      updateDisplay();
    }

    function toggleTimer() {
      initAudio();
      const btn = document.getElementById('start-btn');

      if (!isRunning) {
        if (queueIndex >= queue.length) resetTimer();
        isRunning = true;
        btn.innerText = 'PAUSE';
        btn.classList.add('paused');
        requestWakeLock();
        
        expectedEndTime = Date.now() + (timeRemaining * 1000);
        timerId = setInterval(tick, 200);
      } else {
        isRunning = false;
        btn.innerText = 'RESUME';
        btn.classList.remove('paused');
        releaseWakeLock();
        clearInterval(timerId);
      }
    }

    function resetTimer() {
      if (timerId) clearInterval(timerId);
      isRunning = false;
      releaseWakeLock();
      queue = buildWorkoutQueue(currentDay);
      queueIndex = 0;
      timeRemaining = queue[0].duration;
      
      const btn = document.getElementById('start-btn');
      btn.innerText = 'START';
      btn.classList.remove('paused');
      updateDisplay();
    }

    function skipInterval() {
      if (queueIndex < queue.length - 1) {
        queueIndex++;
        timeRemaining = queue[queueIndex].duration;
        expectedEndTime = Date.now() + (timeRemaining * 1000);
        updateDisplay();
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && isRunning) {
        requestWakeLock();
        tick();
      }
    });

    selectDay(1);
  </script>
</body>
</html>
